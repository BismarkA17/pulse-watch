services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch
      POSTGRES_DB: pulsewatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://pulsewatch:pulsewatch@postgres:5432/pulsewatch
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn pulsewatch.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://pulsewatch:pulsewatch@postgres:5432/pulsewatch
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: python -m pulsewatch.worker
    environment:
      DATABASE_URL: postgresql://pulsewatch:pulsewatch@postgres:5432/pulsewatch
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  generator:
    build: .
    command: python -m pulsewatch.generator
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: